  <!-- FIREBASE CONFIGURATION & LOGIC -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // 1. INSERISCI QUI LE TUE CHIAVI FIREBASE
    const firebaseConfig = {
      apiKey: "INSERISCI_LA_TUA_API_KEY",
      authDomain: "INSERISCI_IL_TUO_AUTH_DOMAIN",
      projectId: "INSERISCI_IL_TUO_PROJECT_ID",
      storageBucket: "INSERISCI_IL_TUO_STORAGE_BUCKET",
      messagingSenderId: "INSERISCI_IL_TUO_MESSAGING_SENDER_ID",
      appId: "INSERISCI_LA_TUA_APP_ID"
    };

    // 2. INSERISCI LA TUA EMAIL GOOGLE PERSONALE
    const OWNER_EMAIL = "rickydalzix@gmail.com";

    let auth, db, collectionDocRef;

    try {
      const app = initializeApp(firebaseConfig);
      auth = getAuth(app);
      db = getFirestore(app);
      const provider = new GoogleAuthProvider();
      const appId = typeof __app_id !== 'undefined' ? __app_id : 'pokemon-collection-app';

      collectionDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'user_collection');

      onAuthStateChanged(auth, (user) => {
        if (user && user.email === OWNER_EMAIL) {
          window.state.isAdmin = true;
        } else {
          window.state.isAdmin = false;
        }
        window.updateAdminUI();
        window.renderApp();
      });

      window.loginWithGoogle = async () => {
        try {
          const result = await signInWithPopup(auth, provider);
          if (result.user.email !== OWNER_EMAIL) {
            alert(`Accesso come ${result.user.email}. Modalità Sola Lettura attiva. Solo ${OWNER_EMAIL} può modificare.`);
          } else {
            alert("Login Amministratore effettuato con successo!");
          }
        } catch (error) {
          console.error("Errore login:", error);
        }
      };

      window.logoutUser = async () => {
        await signOut(auth);
        alert("Logout effettuato.");
      };

      onSnapshot(collectionDocRef, (docSnap) => {
        if (docSnap.exists()) {
          const data = docSnap.data();
          if (data && Array.isArray(data.ownedIds)) {
            window.state.ownedIds = new Set(data.ownedIds);
            window.renderApp();
          }
        }
      }, (err) => console.error("Errore Firestore:", err));

      window.saveStateCloud = async () => {
        if (!window.state.isAdmin || !auth?.currentUser) return;
        try {
          await setDoc(collectionDocRef, {
            ownedIds: Array.from(window.state.ownedIds),
            updatedAt: new Date().toISOString()
          });
        } catch (e) {
          console.error("Errore salvataggio:", e);
        }
      };

    } catch (e) {
      console.warn("Firebase non configurato o in esecuzione locale senza chiavi.");
    }

    document.getElementById('adminToggleBtn')?.addEventListener('click', () => {
      if (auth?.currentUser) {
        if (confirm(`Connesso come ${auth.currentUser.email}. Vuoi disconnetterti?`)) {
          window.logoutUser();
        }
      } else if (window.loginWithGoogle) {
        window.loginWithGoogle();
      }
    });
  </script>

    // Generazione della lista piatta dei 462 artwork
    const PACKS_DATA = [];
    rawSets.forEach(s => {
      s.p.forEach((poke, idx) => {
        PACKS_DATA.push({
          id: `${s.set.toLowerCase().replace(/[^a-z0-9]/g, '')}_${idx + 1}`,
          era: s.era,
          set: s.set,
          year: s.year,
          color: s.color,
          pokemon: poke
        });
      });
    });

    // Funzione per aggiornare la grafica dell'interfaccia Admin
    window.updateAdminUI = function() {
      const icon = document.getElementById('adminIcon');
      const text = document.getElementById('adminStatusText');
      if (window.state.isAdmin) {
        if (icon) icon.className = 'ph-bold ph-lock-key-open text-emerald-400 text-base';
        if (text) {
          text.textContent = 'Modifica Attiva';
          text.className = 'text-emerald-400 font-bold';
        }
      } else {
        if (icon) icon.className = 'ph-bold ph-lock-key text-rose-400 text-base';
        if (text) {
          text.textContent = 'Sola Lettura';
          text.className = 'text-slate-400 font-medium';
        }
      }
    };

    // Toggle del possesso bustina
    window.togglePack = function(id) {
      if (!window.state.isAdmin) {
        alert("Sei in modalità Sola Lettura. Effettua il Login con l'account Amministratore per modificare!");
        return;
      }
      if (window.state.ownedIds.has(id)) {
        window.state.ownedIds.delete(id);
      } else {
        window.state.ownedIds.add(id);
      }

      // Salva sia localmente sia sul Cloud se attivo
      try {
        localStorage.setItem('pkmn_owned_packs', JSON.stringify(Array.from(window.state.ownedIds)));
      } catch(e) {}

      if (typeof window.saveStateCloud === 'function') {
        window.saveStateCloud();
      }

      window.renderApp();
    };

    // Rendering dell'intera app
    window.renderApp = function() {
      const grid = document.getElementById('packsGrid');
      if (!grid) return;

      const era = window.state.filterEra;
      const status = window.state.filterStatus;
      const query = window.state.searchQuery.toLowerCase();

      // Filtra bustine
      const filtered = PACKS_DATA.filter(p => {
        const matchesEra = (era === 'all' || p.era === era);
        const isOwned = window.state.ownedIds.has(p.id);
        const matchesStatus = (status === 'all' || (status === 'owned' && isOwned) || (status === 'missing' && !isOwned));
        const matchesQuery = (p.pokemon.toLowerCase().includes(query) || p.set.toLowerCase().includes(query));
        return matchesEra && matchesStatus && matchesQuery;
      });

      // Aggiorna la barra delle statistiche
      const totalCount = PACKS_DATA.length; // 462
      const ownedCount = window.state.ownedIds.size;
      const pct = Math.round((ownedCount / totalCount) * 100);

      document.getElementById('statsRatio').textContent = `${ownedCount} / ${totalCount} (${pct}%)`;
      document.getElementById('progressBar').style.width = `${pct}%`;

      // Costruisci le carte dinamiche
      let html = '';
      filtered.forEach(p => {
        const owned = window.state.ownedIds.has(p.id);
        
        html += `
          <div 
            onclick="window.togglePack('${p.id}')"
            class="relative flex flex-col justify-between rounded-2xl p-3 border transition-all duration-300 cursor-pointer select-none overflow-hidden ${
              owned 
                ? 'bg-slate-800/90 border-emerald-500/60 shadow-lg shadow-emerald-950/30' 
                : 'bg-slate-900/60 border-slate-800 hover:border-slate-700 opacity-80 hover:opacity-100'
            }"
          >
            <!-- Badge Anno e Stato -->
            <div class="flex items-center justify-between gap-1 mb-2">
              <span class="text-[10px] font-extrabold px-2 py-0.5 rounded-full bg-slate-950/60 text-slate-400 border border-slate-800">
                ${p.year}
              </span>
              <span class="text-[10px] font-extrabold px-2 py-0.5 rounded-full ${
                owned 
                  ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/40' 
                  : 'bg-rose-500/20 text-rose-400 border border-rose-500/40'
              }">
                ${owned ? 'POSSEDUTO' : 'MANCANTE'}
              </span>
            </div>

            <!-- ANTEPRIMA BUSTINA OLOGRAFICA -->
            <div class="relative w-full h-32 rounded-xl bg-gradient-to-br ${p.color} p-2 flex flex-col justify-between overflow-hidden shadow-inner my-1 pack-texture">
              <!-- Sigillo Metallizzato Superiore -->
              <div class="w-full h-2 crimp-pattern rounded-t border-b border-black/20"></div>

              <!-- Logo Set e Silhouette Pokémon -->
              <div class="z-10 text-center my-auto px-1">
                <i class="ph-bold ph-pokeball text-3xl text-white/40 drop-shadow mb-1 inline-block"></i>
                <div class="text-xs font-black text-white drop-shadow-md leading-tight uppercase tracking-wider truncate">
                  ${p.pokemon}
                </div>
              </div>

              <!-- Sigillo Metallizzato Inferiore -->
              <div class="w-full h-2 crimp-pattern rounded-b border-t border-black/20"></div>
            </div>

            <!-- Informazioni Set -->
            <div class="mt-2 text-left">
              <div class="text-xs font-bold text-slate-200 truncate">${p.set}</div>
              <div class="text-[10px] font-medium text-slate-400">${p.era} Serie</div>
            </div>
          </div>
        `;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full py-12 text-center text-slate-500">
            <i class="ph-bold ph-ghost text-4xl mb-2 inline-block"></i>
            <p class="text-sm font-semibold">Nessuna bustina trovata con i filtri selezionati.</p>
          </div>
        `;
      } else {
        grid.innerHTML = html;
      }
    };

    // EVENT LISTENERS FILTRI
    document.getElementById('searchInput')?.addEventListener('input', (e) => {
      window.state.searchQuery = e.target.value;
      window.renderApp();
    });

    document.getElementById('eraSelect')?.addEventListener('change', (e) => {
      window.state.filterEra = e.target.value;
      window.renderApp();
    });

    document.getElementById('statusSelect')?.addEventListener('change', (e) => {
      window.state.filterStatus = e.target.value;
      window.renderApp();
    });

    // MODALE CONDIVISIONE
    const shareModal = document.getElementById('shareModal');
    document.getElementById('shareBtn')?.addEventListener('click', () => {
      document.getElementById('shareUrlInput').value = window.location.href.split('?')[0];
      shareModal?.classList.remove('hidden');
    });

    document.getElementById('closeShareModal')?.addEventListener('click', () => {
      shareModal?.classList.add('hidden');
    });

    document.getElementById('copyShareUrlBtn')?.addEventListener('click', () => {
      const input = document.getElementById('shareUrlInput');
      input.select();
      document.execCommand('copy');
      alert('Link copiato negli appunti!');
      shareModal?.classList.add('hidden');
    });

    // Caricamento iniziale all'apertura della pagina
    window.onload = function() {
      window.updateAdminUI();
      window.renderApp();
    };
  </script>
